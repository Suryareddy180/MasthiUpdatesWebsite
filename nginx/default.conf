server {
    listen 80;
    server_name masthiupdates.online www.masthiupdates.online;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name masthiupdates.online www.masthiupdates.online;

    ssl_certificate /etc/letsencrypt/live/masthiupdates.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/masthiupdates.online/privkey.pem;

    # Backend (Django)
    location / {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Django admin
    location /admin/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Static files
    location /static/ {
        alias /app/staticfiles/;
    }

    # Media files
    location /media/ {
        alias /app/media/;
    }

    # Certbot challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
}
